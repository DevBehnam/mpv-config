# script-opts/ytsub.conf

# The second subtitle track loaded by alt+Y (auto dual-sub mode), alongside
# the video's original-language captions. Only matters for alt+Y — the
# interactive picker (alt+y) ignores this. Leave unset if you never use
# alt+Y and just want the single-language picker.
source_lang=en

# YouTube's auto-captions duplicate each line across two overlapping
# timestamps (top/bottom scroll effect); this collapses that duplication
# so each line displays once. This is a bugfix, not a style choice — keep
# it on. Note: only affects subs downloaded after this is set, cached
# files aren't retroactively cleaned.
filter_sub_single_line=yes

# Key binding to open the interactive language picker (mpv console select
# menu). Set explicitly to the script's own default for documentation
# completeness — change only if it collides with something in input.conf.
load_autosub_binding=alt+y

# Key binding for auto dual-sub mode: loads the original-language track as
# primary, plus source_lang as secondary if set. A bare capital letter
# already implies Shift in mpv's key syntax, so this is the same binding
# as "alt+shift+y" — not a separate one. Set explicitly to the default,
# same reasoning as above.
autoload_autosub_binding=alt+Y

# Where downloaded subtitle files are cached. This is a relative path that
# the script always resolves under %USERPROFILE% on Windows, regardless of
# what string you put here — there's no value that keeps it inside the
# portable mpv folder. Set explicitly to the script's own default rather
# than patching the script, accepting that this one folder lives outside
# the portable install.
cache_dir=.cache/ytsub/
