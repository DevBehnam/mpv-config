MBTN_LEFT           ignore
MBTN_LEFT_DBL       cycle fullscreen
MBTN_RIGHT          script-binding uosc/menu
MBTN_BACK           no-osd sub-seek +1
MBTN_FORWARD        no-osd sub-seek -1

WHEEL_UP            add volume +2; script-binding uosc/flash-volume
WHEEL_DOWN          add volume -2; script-binding uosc/flash-volume
WHEEL_LEFT          seek -5; script-binding uosc/flash-timeline
WHEEL_RIGHT         seek +5; script-binding uosc/flash-timeline


RIGHT               no-osd seek +5
LEFT                no-osd seek -5
UP                  no-osd seek +60
DOWN                no-osd seek -60

B                   seek 0 absolute-percent exact; set pause yes; script-binding uosc/flash-timeline
N                   no-osd seek 100 absolute-percent exact; set pause yes; script-binding uosc/flash-timeline

Shift+RIGHT         seek +5  exact; script-binding uosc/flash-timeline
Shift+LEFT          seek -5  exact; script-binding uosc/flash-timeline
Shift+UP            seek +60 exact; script-binding uosc/flash-timeline
Shift+DOWN          seek -60 exact; script-binding uosc/flash-timeline

Ctrl+RIGHT          no-osd sub-seek +1
Ctrl+LEFT           no-osd sub-seek -1

.                   frame-step; script-binding uosc/flash-timeline
,                   frame-back-step; script-binding uosc/flash-timeline

=                   add volume +5; script-binding uosc/flash-volume
-                   add volume -5; script-binding uosc/flash-volume
Ctrl+=              add volume +10; script-binding uosc/flash-volume
Ctrl+-              add volume -10; script-binding uosc/flash-volume
m                   cycle mute; script-binding uosc/flash-volume

[                   add speed -0.1; script-binding uosc/flash-speed
]                   add speed +0.1; script-binding uosc/flash-speed
\                   cycle-values speed          0.25 0.50 0.75 1 1.25 1.50 1.75 2.00; script-binding uosc/flash-speed
|                   cycle-values !reverse speed 0.25 0.50 0.75 1 1.25 1.50 1.75 2.00; script-binding uosc/flash-speed

Ctrl+/              script-binding uosc/keybinds

Ctrl+>              add sub-delay +0.5
Ctrl+<              add sub-delay -0.5

Ctrl+;              add sub-scale -0.5
Ctrl+'              add sub-scale +0.5

P                   cycle pause; script-binding uosc/flash-pause-indicator
SPACE               cycle pause; script-binding uosc/flash-pause-indicator

f                   cycle fullscreen
ENTER               cycle fullscreen
ESC                 set fullscreen no

t                   cycle ontop

i                   script-binding stats/display-stats-toggle

Ctrl+P              script-binding select/menu
Ctrl+p              script-binding uosc/menu-blurred

S                   async screenshot
Alt+s               async screenshot window

Alt+RIGHT           add window-scale +0.1
Alt+LEFT            add window-scale -0.1
Alt+UP              cycle-values window-scale          0.25 0.50 0.75 1 1.25 1.50 1.75 2.00 2.25 2.50 2.75 3.00
Alt+Down            cycle-values !reverse window-scale 0.25 0.50 0.75 1 1.25 1.50 1.75 2.00 2.25 2.50 2.75 3.00

r                   ignore
/                   ignore
1                   ignore
2                   ignore
3                   ignore
4                   ignore
5                   ignore
6                   ignore
7                   ignore
8                   ignore
9                   ignore
0                   ignore

q                   quit
Ctrl+w              quit
Ctrl+Shift+w        quit-watch-later


########
# Menu #
########
#                  ignore                                                   #menu: File > -
o                  script-binding uosc/open-file                            #menu: File > Open
Ctrl+C             script-binding uosc/copy-to-clipboard                    #menu: File > Copy Current File Path
E                  script-binding uosc/show-in-directory                    #menu: File > Show Current File in Explorer
DEL                script-message-to delete_current_file delete-file        #menu: File > Move to Recycle Bin
Shift+DEL          script-binding uosc/delete-file-next                     #menu: File > Delete File

Ctrl+[             add speed -0.25; script-binding uosc/flash-speed         #menu: Playback > Decrease Speed
Ctrl+]             add speed +0.25; script-binding uosc/flash-speed         #menu: Playback > Increase Speed
Ctrl+{             multiply speed 0.5; script-binding uosc/flash-speed      #menu: Playback > Half Speed
Ctrl+}             multiply speed 2.0; script-binding uosc/flash-speed      #menu: Playback > Double Speed
BS                 set speed 1; script-binding uosc/flash-speed             #menu: Playback > Reset Speed

#                  ignore                                                   #menu: Playlist > -
Ctrl+l             script-binding uosc/playlist                             #menu: Playlist > Show
Ctrl+HOME          script-binding uosc/first                                #menu: Playlist > First File
Ctrl+PGDWN         script-binding uosc/prev                                 #menu: Playlist > Previous File
Ctrl+PGUP          script-binding uosc/next                                 #menu: Playlist > Next File
Ctrl+END           script-binding uosc/last                                 #menu: Playlist > Last File
#                  playlist-shuffle                                         #menu: Playlist > Toggle Shuffle
#                  playlist-clear                                           #menu: Playlist > Clear

#                  ignore                                                   #menu: Chapters > -
c                  script-binding uosc/chapters                             #menu: Chapters > Select
HOME               set chapter 0; script-binding uosc/flash-timeline        #menu: Chapters > First Chapter
PGUP               add chapter -1; script-binding uosc/flash-timeline       #menu: Chapters > Previous Chapter
PGDWN              add chapter +1; script-binding uosc/flash-timeline       #menu: Chapters > Next Chapter
END                add chapter 999999; script-binding uosc/flash-timeline   #menu: Chapters > Last Chapter

Alt+q              script-binding uosc/stream-quality                       #menu: Video > Stream Quality
Alt+R              cycle-values video-rotate 90 180 270 0                   #menu: Video > Rotate Video
l                  ab-loop; script-binding uosc/flash-timeline              #menu: Video > Set/Clear A-B Loop Points
D                  cycle deband                                             #menu: Video > Toggle Deband #@state=(deband and 'checked')
d                  cycle deinterlace                                        #menu: Video > Toggle Deinterlace #@state=(deinterlace and 'checked')
Alt+1              add contrast -1                                          #menu: Video > Contrast > Decrease
Alt+2              add contrast +1                                          #menu: Video > Contrast > Increase
Alt+3              add brightness -1                                        #menu: Video > Brightness > Decrease
Alt+4              add brightness +1                                        #menu: Video > Brightness > Increase
Alt+5              add gamma -1                                             #menu: Video > Gamma > Decrease
Alt+6              add gamma +1                                             #menu: Video > Gamma > Increase
Alt+7              add saturation -1                                        #menu: Video > Saturation > Decrease
Alt+8              add saturation +1                                        #menu: Video > Saturation > Increase
Alt+-              add video-zoom -0.1                                      #menu: Video > Zoom > Decrease
Alt+=              add video-zoom +0.1                                      #menu: Video > Zoom > Increase

#                  ignore                                                   #menu: Audio > -
a                  script-binding uosc/audio                                #menu: Audio > Select
X                  add audio-delay -0.1                                     #menu: Audio > Delay > Decrease
C                  add audio-delay +0.1                                     #menu: Audio > Delay > Increase
Z                  set audio-delay 0                                        #menu: Audio > Delay > Reset

#                  ignore                                                   #menu: Subtitles > -
s                  script-binding uosc/subtitles                            #menu: Subtitles > Select
<                  add sub-delay -0.1                                       #menu: Subtitles > Delay > Decrease
>                  add sub-delay +0.1                                       #menu: Subtitles > Delay > Increase
?                  set sub-delay 0                                          #menu: Subtitles > Delay > Reset
;                  add sub-scale -0.1                                       #menu: Subtitles > Scale > Decrease
'                  add sub-scale +0.1                                       #menu: Subtitles > Scale > Increase

Q                  quit-watch-later                                         #menu: Save and Quit
