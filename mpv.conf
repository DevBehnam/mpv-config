# mpv config file https://mpv.io/manual/master/#options


##########
# Window #
##########

# Set window size to 60 % of screen
autofit = 60%x60%

# The Screen where to start
screen = 0

# Snap the player window to screen edges
snap-window = yes

# Set the window title. This is used for the video window
title = ${filename}

# Create a video output window even if there is no video.
# This can be useful when pretending that mpv is a GUI application.
force-window = yes

# Disable the title bar
title-bar = no

# Disable osd-bar to use uosc instead.
osd-bar=no

# Disable if you want uosc to draw its own border
# border=no

# Set on-screen display font
osd-font=Maple Mono


#########
# Audio #
#########

# Set default volume
volume = 100

# Set preferred audio language to English
alang = en,eng


############
# Subtitle #
############

# Load all external subs containing the media filename
sub-auto = fuzzy

# Set preferred subtitle language to English and Persian
slang=en,eng,fa,per

sub-border-style=outline-and-shadow
sub-outline-size=0.33
sub-font=Maple Mono
sub-color="#eed49f"
sub-shadow-color="#b0000000"
sub-shadow-offset=1.8
sub-blur=0
sub-scale=1
sub-bold=no
sub-italic=no


#########
# Video #
#########

# Use the modern GPU video output driver
vo=gpu-next

# Automatically use hardware video decoding when available
hwdec=auto


############
# Playback #
############

# no:     If the current file ends, go to the next file or terminate. (Default.)
# yes:    Don't terminate if the current file is the last playlist entry. Equivalent to --keep-open without arg
# always: Playback will never automatically advance to the next file.
keep-open=yes

# If set to no, instead of pausing when --keep-open is active,
# just stop at end of file and continue playing forward when you
# seek backwards until end where it stops again. Default: yes.
keep-open-pause = no


#########
#  OSD  #
#########

# Disable internal OSC script to use uosc instead.
osc = no

# Set the duration of the OSD messages in ms (default: 1000)
osd-duration = 2000

# Show a message on OSD when playback starts
osd-playing-msg = ${filename}


####################
# Program Behavior #
####################

# Makes mpv wait idly instead of quitting when there is no file to play.
idle = yes

# Properties to reset when next file starts
reset-on-next-file = video-zoom,video-pan-y,pause

# Create a playlist from the parent directory with files matching --directory-filter-types
autocreate-playlist = filter

# Keep the aspect ratio of the video
keepaspect=yes
keepaspect-window=yes


##############
# WatchLater #
##############
# Set the watch files directory.
--watch-later-dir=~~/../watch_later

# The options that are saved in "watch later" files
watch-later-options = start,pause,sid,volume

# Wherther or not resume a file from its watch_later data
resume-playback-check-mtime=yes


##############
# Screenshot #
##############

# Directory to save screenshots
screenshot-dir=~~/../Screenshots

# File name to use for screenshots.
screenshot-template="%F %wH-%wM-%wS %wT"

# Set the image file type used for saving screenshots.
screenshot-format=png

# Set the PNG compression level <0-9>. Higher means better compression.
# This will affect the file size of the written screenshot file and the time it takes to write a screenshot.
# Too high compression might occupy enough CPU time to interrupt playback. The default is 7.
screenshot-png-compression=7


#########
# Input #
#########

# Delay in milliseconds before we start to autorepeat a key (default: 200)
input-ar-delay = 500

# Number of key presses to generate per second on autorepeat (default: 40)
input-ar-rate = 20


##########
# yt-dlp #
##########

ytdl-format=bv[height<=1080][vcodec!~='^(vp0?9)']+ba/b[height<=1080]
